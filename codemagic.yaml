workflows:
  twentyone-unsigned:
    name: TwentyOne Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Build unsigned app
        script: |
          xcodebuild -project TwentyOne.xcodeproj -scheme TwentyOne -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath "$CM_BUILD_DIR/DerivedData"
      - name: Package IPA
        script: |
          rm -rf Payload
          mkdir -p Payload
          cp -R "$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/TwentyOne.app" Payload/
          zip -r TwentyOne.ipa Payload
    artifacts:
      - TwentyOne.ipa
